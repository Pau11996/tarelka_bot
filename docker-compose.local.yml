# Local stack with Postgres.
# docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# DATABASE_URL=postgresql+asyncpg://wellhealth:wellhealth@postgres:5432/wellhealth

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wellhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellhealth}
      POSTGRES_DB: ${POSTGRES_DB:-wellhealth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wellhealth} -d ${POSTGRES_DB:-wellhealth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai_analyzer:
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    depends_on:
      postgres:
        condition: service_healthy
      ai_analyzer:
        condition: service_healthy

  mobile_api:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    command: ["python", "-m", "uvicorn", "src.mobile_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_ANALYZER_URL: ${AI_ANALYZER_URL:-http://ai_analyzer:8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-taarelka_bot}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Moscow}
      DAILY_REQUEST_LIMIT: ${DAILY_REQUEST_LIMIT:-6}
      SUBSCRIPTION_DAILY_REQUEST_LIMIT: ${SUBSCRIPTION_DAILY_REQUEST_LIMIT:-30}
      REFERRAL_BONUS_REQUESTS: ${REFERRAL_BONUS_REQUESTS:-3}
      MOBILE_JWT_SECRET: ${MOBILE_JWT_SECRET:-dev-mobile-jwt-secret-change-me}
    ports:
      - "${MOBILE_API_PUBLISH:-127.0.0.1:8001}:8000"
    volumes:
      - ./logs:/opt/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      ai_analyzer:
        condition: service_healthy

volumes:
  postgres_data:
