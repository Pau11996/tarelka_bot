# Production stack. Postgres is not included — set DATABASE_URL to Supabase.
services:
  ai_analyzer:
    build:
      context: .
      dockerfile: Dockerfile.ai
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-taarelka_bot}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-}
      AI_ESTIMATED_COST_USD_PER_ANALYSIS: ${AI_ESTIMATED_COST_USD_PER_ANALYSIS:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-120}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_HTTP_PROXY: ${OPENAI_HTTP_PROXY:-}
      VOSK_MODEL_PATH: ${VOSK_MODEL_PATH:-/opt/vosk/model}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,ai_analyzer,bot}
      PRODUCT_DB_PATH: /opt/data/green_by_products.sqlite
    volumes:
      - ./logs:/opt/logs
      - ./data:/opt/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    depends_on:
      ai_analyzer:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
      TELEGRAM_FEEDBACK_CHAT: ${TELEGRAM_FEEDBACK_CHAT:-}
      DATABASE_URL: ${DATABASE_URL}
      AI_ANALYZER_URL: ${AI_ANALYZER_URL:-http://ai_analyzer:8000}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Moscow}
      MESSAGE_CLEANUP_TTL_SECONDS: ${MESSAGE_CLEANUP_TTL_SECONDS:-7200}
      FREE_PHOTO_DAILY_LIMIT: ${FREE_PHOTO_DAILY_LIMIT:-3}
      LEGACY_FREE_PHOTO_DAILY_LIMIT: ${LEGACY_FREE_PHOTO_DAILY_LIMIT:-6}
      FREE_TEXT_DAILY_LIMIT: ${FREE_TEXT_DAILY_LIMIT:-60}
      FREE_VOICE_DAILY_LIMIT: ${FREE_VOICE_DAILY_LIMIT:-10}
      SUBSCRIPTION_DAILY_REQUEST_LIMIT: ${SUBSCRIPTION_DAILY_REQUEST_LIMIT:-30}
      SUBSCRIPTION_TEXT_DAILY_LIMIT: ${SUBSCRIPTION_TEXT_DAILY_LIMIT:-100}
      SUBSCRIPTION_VOICE_DAILY_LIMIT: ${SUBSCRIPTION_VOICE_DAILY_LIMIT:-30}
      SUBSCRIPTION_PRICE_STARS: ${SUBSCRIPTION_PRICE_STARS:-150}
      SUBSCRIPTION_DURATION_DAYS: ${SUBSCRIPTION_DURATION_DAYS:-30}
      REFERRAL_MONTHLY_GOAL: ${REFERRAL_MONTHLY_GOAL:-5}
      DIARY_NUDGES_ENABLED: ${DIARY_NUDGES_ENABLED:-true}
      DIARY_NUDGES_INTERVAL_SECONDS: ${DIARY_NUDGES_INTERVAL_SECONDS:-1200}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-help.4posts@gmail.com}
      PRODUCT_DB_PATH: /opt/data/green_by_products.sqlite
      MOBILE_MEDIA_DIR: /opt/mobile-media
    volumes:
      - ./logs:/opt/logs
      - ./data:/opt/data:ro
      - mobile_media:/opt/mobile-media
    restart: unless-stopped

  mobile_api:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    command:
      - sh
      - -c
      - >-
        python -c 'from src.mobile_api.main import validate_runtime_config; validate_runtime_config()'
        && alembic upgrade head && exec python -m uvicorn src.mobile_api.main:app
        --host 0.0.0.0 --port 8000 --root-path "$${MOBILE_API_ROOT_PATH}"
        --proxy-headers --forwarded-allow-ips "127.0.0.1,172.30.77.0/24"
    environment:
      MOBILE_API_ENV: production
      MOBILE_API_ROOT_PATH: /api
      MOBILE_MEDIA_DIR: /opt/mobile-media
      MOBILE_DEMO_BILLING: ${MOBILE_DEMO_BILLING:-1}
      MOBILE_JWT_SECRET: ${MOBILE_JWT_SECRET:-}
      HEALTH_CONNECT_ENABLED: ${HEALTH_CONNECT_ENABLED:-0}
      DATABASE_URL: ${DATABASE_URL}
      AI_ANALYZER_URL: ${AI_ANALYZER_URL:-http://ai_analyzer:8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-taarelka_bot}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Moscow}
    expose:
      - "8000"
    volumes:
      - ./logs:/opt/logs
      - mobile_media:/opt/mobile-media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      ai_analyzer:
        condition: service_healthy

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    depends_on:
      ai_analyzer:
        condition: service_healthy
    ports:
      - "${LANDING_PORT:-8080}:80"
    environment:
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-taarelka_bot}
      LANDING_BOT_USERNAME: ${LANDING_BOT_USERNAME:-taarelka_bot}
      TELEGRAM_FEEDBACK_CHAT: ${TELEGRAM_FEEDBACK_CHAT:-}
      LANDING_TITLE: ${LANDING_TITLE:-ТАРЕЛКА}
      LANDING_HOST: ${LANDING_HOST:-tarelkaa.by}
      LANDING_ORIGIN: ${LANDING_ORIGIN:-https://tarelkaa.by}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-G-DBX8MSSJDK}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-help.4posts@gmail.com}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-Администратор сервиса ТАРЕЛКА}
      FREE_PHOTO_DAILY_LIMIT: ${FREE_PHOTO_DAILY_LIMIT:-3}
      FREE_TEXT_DAILY_LIMIT: ${FREE_TEXT_DAILY_LIMIT:-60}
      FREE_VOICE_DAILY_LIMIT: ${FREE_VOICE_DAILY_LIMIT:-10}
      SUBSCRIPTION_DAILY_LIMIT: ${SUBSCRIPTION_DAILY_REQUEST_LIMIT:-30}
      SUBSCRIPTION_VOICE_DAILY_LIMIT: ${SUBSCRIPTION_VOICE_DAILY_LIMIT:-30}
      SUBSCRIPTION_PRICE_STARS: ${SUBSCRIPTION_PRICE_STARS:-150}
      SUBSCRIPTION_DURATION_DAYS: ${SUBSCRIPTION_DURATION_DAYS:-30}
      REFERRAL_MONTHLY_GOAL: ${REFERRAL_MONTHLY_GOAL:-5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mobile_media:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.77.0/24
