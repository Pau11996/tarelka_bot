<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Обзор карточек</title><link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="gallery.css"></head><body class="board-page"><script src="cards.js"></script><script>
const type=new URLSearchParams(location.search).get('type')==='meal'?'meal':'day';const selection=cards.filter(card=>card.type===type);if(type==='day')document.body.classList.add('day-board');
document.body.insertAdjacentHTML('afterbegin',`<h1>${type==='day'?'Моя дневная норма · 5 коротких вариантов':'Блюда и товары · 5 вариантов'}</h1><p>ТАРЕЛКА / ${type==='day'?'Цель КБЖУ — главный акцент. Формат 1080 × 216.':'дизайн карточек для соцсетей / 1080 × 1080'}</p><div class="board-grid">${selection.map(card=>`<div class="board-item">${type==='day'?`<div class="board-caption"><label>${card.code} / ${card.name}</label><small>${card.code==='Д3'||card.code==='Д5'?'Только норма':card.code==='Д4'?'Норма + съеденное по всем КБЖУ':'Норма + короткая подпись о съеденном'}</small></div>`:''}<div class="board-image"><img src="exports/${card.id}.jpg" alt="${card.name}"></div>${type==='meal'?`<label>${card.code} / ${card.name}</label>`:''}</div>`).join('')}<div class="board-empty"><strong>Есть чем<br>поделиться.</strong>Нажмите на вариант в галерее,<br>чтобы посмотреть его крупнее.<br><small>Данные в макетах демонстрационные.</small></div></div>${type==='day'?'<div class="board-footnote">Демонстрационные значения. Норма: 2 100 ккал / Б 120 г / Ж 60 г / У 270 г. Только дизайн-макеты.</div>':''}`);
</script></body></html>
