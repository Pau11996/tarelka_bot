<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Обзор карточек</title><link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="gallery.css"></head><body class="board-page"><script src="cards.js"></script><script>const type=new URLSearchParams(location.search).get('type')==='meal'?'meal':'day';const selection=cards.filter(card=>card.type===type);document.body.insertAdjacentHTML('afterbegin',`<h1>${type==='day'?'Итоги дня · 5 вариантов':'Блюда и товары · 5 вариантов'}</h1><p>ТАРЕЛКА / дизайн карточек для соцсетей / 1080 × 1080</p><div class="board-grid">${selection.map(card=>`<div class="board-item"><div class="board-image"><img src="exports/${card.id}.jpg" alt="${card.name}"></div><label>${card.code} / ${card.name}</label></div>`).join('')}<div class="board-empty"><strong>Есть чем<br>поделиться.</strong>Нажмите на вариант в галерее,<br>чтобы посмотреть его крупнее.<br><small>Данные в макетах демонстрационные.</small></div></div>`);</script></body></html>
